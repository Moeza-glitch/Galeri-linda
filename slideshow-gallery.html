<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kekasih Hatiku Linda Siti Puspasari</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #d63384;
    }

    /* Slideshow container */
    .slideshow-container {
      position: relative;
      max-width: 100%;
      margin: auto;
    }

    /* Slides */
    .slide {
      display: none;
    }

    .slide img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    /* Navigation buttons */
    .prev, .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      border-radius: 50%;
    }

    .prev {
      left: 10px;
    }

    .next {
      right: 10px;
    }

    /* Dots for navigation */
    .dots {
      text-align: center;
      margin-top: 10px;
    }

    .dots span {
      cursor: pointer;
      height: 15px;
      width: 15px;
      margin: 0 5px;
      background-color: #bbb;
      border-radius: 50%;
      display: inline-block;
      transition: background-color 0.6s ease;
    }

    .dots .active {
      background-color: #717171;
    }

    /* Responsive Design */
    @media screen and (max-width: 600px) {
      .prev, .next {
        padding: 5px;
      }
    }
  </style>
</head>
<body>
  <h1>Kekasih Hatiku Linda Siti Puspasari</h1>

  <!-- Slideshow Container -->
  <div class="slideshow-container">
    <div class="slide">
      <img src="BC25D507-79EE-46EF-88F9-651AB13D7152.jpeg" alt="Linda 1">
    </div>
    <div class="slide">
      <img src="1EA4DDDA-D03D-4677-AED0-946855D76A1B.jpeg" alt="Linda 2">
    </div>
    <div class="slide">
      <img src="406C468A-4B95-4D69-8610-3655774474C1.jpeg" alt="Linda 3">
    </div>
    <div class="slide">
      <img src="8CBBF58F-143D-40E7-9E2B-B1F2E9282F8F.jpeg" alt="Linda 4">
    </div>
    <div class="slide">
      <img src="274D8C45-F40D-4F0D-920E-6A6FA31E490E.jpeg" alt="Linda 5">
    </div>
    <div class="slide">
      <img src="66A67260-83D1-4504-8A28-74E4BAC01063.jpeg" alt="Linda 6">
    </div>
    <div class="slide">
      <img src="854B70B8-87CC-4B9A-952B-335B396D76EC.jpeg" alt="Linda 7">
    </div>

    <!-- Navigation Buttons -->
    <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
    <button class="next" onclick="changeSlide(1)">&#10095;</button>
  </div>

  <!-- Dots for Navigation -->
  <div class="dots">
    <span class="dot" onclick="currentSlide(1)"></span>
    <span class="dot" onclick="currentSlide(2)"></span>
    <span class="dot" onclick="currentSlide(3)"></span>
    <span class="dot" onclick="currentSlide(4)"></span>
    <span class="dot" onclick="currentSlide(5)"></span>
    <span class="dot" onclick="currentSlide(6)"></span>
    <span class="dot" onclick="currentSlide(7)"></span>
  </div>

  <!-- JavaScript for Slideshow -->
  <script>
    let slideIndex = 0;
    showSlides();

    function showSlides() {
      let slides = document.getElementsByClassName("slide");
      let dots = document.getElementsByClassName("dot");

      // Hide all slides
      for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
      }

      slideIndex++;
      if (slideIndex > slides.length) slideIndex = 1; // Loop back to the first slide

      // Remove active class from all dots
      for (let i = 0; i < dots.length; i++) {
        dots[i].className = dots[i].className.replace(" active", "");
      }

      // Display the current slide and activate the corresponding dot
      slides[slideIndex - 1].style.display = "block";
      dots[slideIndex - 1].className += " active";

      setTimeout(showSlides, 3000); // Change slide every 3 seconds
    }

    function changeSlide(n) {
      slideIndex += n - 1; // Adjust index for manual navigation
      showSlides();
    }

    function currentSlide(n) {
      slideIndex = n - 1;
      showSlides();
    }
  </script>
</body>
</html>
